name: "timing_analysis"
description: "Test different lookback periods to find optimal entry timing"

date_range:
  start: "2025-04-01"
  end: "2025-11-01"

fixed:
  fees_bps: 200
  slippage_bps: 100
  min_volume: 5000
  longshot_min: 0.01
  longshot_max: 0.10

vary:
  lookback_days:
    - 3    # 3 days before resolution
    - 7    # 1 week before (baseline)
    - 14   # 2 weeks before
    - 30   # 1 month before
